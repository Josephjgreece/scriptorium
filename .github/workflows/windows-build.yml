name: Windows installers

on:
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "src-tauri/**", "package*.json", "index.html", "vite.config.ts", ".github/workflows/windows-build.yml"]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Each runner builds for its own CPU, so the arm64 job produces a native ARM installer.
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - name: Name the installer by CPU
        shell: bash
        run: |
          mkdir -p dist-installer
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do
            cp "$f" "dist-installer/$(basename "$f")"
          done
          ls -l dist-installer

      - uses: actions/upload-artifact@v4
        with:
          name: scriptorium-windows-${{ matrix.arch }}
          path: dist-installer/*.exe
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/*.exe
