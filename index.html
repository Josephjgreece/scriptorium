<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scriptorium</title>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="pane lib" id="libPane">
        <header class="pane-head">
          <span class="pane-title">Library</span>
          <button class="icon-btn" id="btnNewGroup" title="New group (Ctrl/Cmd+Shift+N)" aria-label="New group"></button>
        </header>
        <nav class="tree" id="tree" aria-label="Groups"></nav>
      </aside>

      <div class="split" id="split1" role="separator" aria-orientation="vertical"></div>

      <section class="pane list" id="listPane">
        <header class="pane-head">
          <input id="search" type="search" placeholder="Search library" aria-label="Search library" spellcheck="false" />
          <button class="icon-btn" id="btnNewSheet" title="New sheet (Ctrl/Cmd+N)" aria-label="New sheet"></button>
        </header>
        <div class="list-title" id="listTitle"></div>
        <div class="sheets" id="sheets"></div>
      </section>

      <div class="split" id="split2" role="separator" aria-orientation="vertical"></div>

      <main class="editor-pane">
        <header class="ed-head">
          <div class="ed-crumb" id="edCrumb"></div>
          <div class="ed-tools">
            <button class="icon-btn" id="btnTypewriter" title="Typewriter mode (Ctrl/Cmd+Shift+T)" aria-label="Typewriter mode"></button>
            <button class="icon-btn" id="btnTheme" title="Theme (Ctrl/Cmd+Shift+D)" aria-label="Switch theme"></button>
            <button class="icon-btn" id="btnExport" title="Export sheet (Ctrl/Cmd+Shift+E)" aria-label="Export sheet"></button>
            <button class="icon-btn" id="btnFocus" title="Focus mode (Ctrl/Cmd+Shift+F)" aria-label="Focus mode"></button>
          </div>
        </header>
        <div class="editor" id="editor"></div>
        <div class="empty" id="empty">
          <p>Pick a sheet, or start a new one.</p>
          <button class="btn" id="btnEmptyNew">New sheet</button>
        </div>
        <footer class="status" id="status">
          <span id="stWords">0 words</span>
          <span id="stChars">0 characters</span>
          <span id="stRead">0 min read</span>
          <span class="grow"></span>
          <span id="stSave"></span>
        </footer>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
