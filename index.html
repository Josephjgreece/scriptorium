<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scriptorium</title>
  </head>
  <body>
    <div class="app" id="app">
      <!-- toolbar row: one bar across the window, its sections lined up over the panes -->
      <header class="tb tb-lib">
        <button class="icon-btn" id="btnSidebar" title="Hide sidebar (Ctrl/Cmd+\)" aria-label="Toggle sidebar"></button>
        <span class="tb-grow"></span>
        <button class="icon-btn" id="btnNewGroup" title="New group (Ctrl/Cmd+Shift+N)" aria-label="New group"></button>
      </header>
      <div class="split" id="split1" role="separator" aria-orientation="vertical"></div>
      <header class="tb tb-list">
        <button class="icon-btn only-collapsed" id="btnSidebar2" title="Show sidebar (Ctrl/Cmd+\)" aria-label="Show sidebar"></button>
        <input id="search" type="search" placeholder="Search library" aria-label="Search library" spellcheck="false" />
        <button class="icon-btn" id="btnNewSheet" title="New sheet (Ctrl/Cmd+N)" aria-label="New sheet"></button>
      </header>
      <div class="split" id="split2" role="separator" aria-orientation="vertical"></div>
      <header class="tb tb-ed">
        <div class="ed-crumb" id="edCrumb"></div>
        <div class="ed-tools">
          <button class="icon-btn" id="btnTypewriter" title="Typewriter mode (Ctrl/Cmd+Shift+T)" aria-label="Typewriter mode"></button>
          <button class="icon-btn" id="btnTheme" title="Theme (Ctrl/Cmd+Shift+D)" aria-label="Switch theme"></button>
          <button class="icon-btn" id="btnExport" title="Export sheet (Ctrl/Cmd+Shift+E)" aria-label="Export sheet"></button>
          <button class="icon-btn" id="btnFocus" title="Focus mode (Ctrl/Cmd+Shift+F)" aria-label="Focus mode"></button>
        </div>
      </header>

      <!-- panes row -->
      <aside class="pane lib" id="libPane">
        <nav class="tree" id="tree" aria-label="Library" tabindex="0"></nav>
        <footer class="lib-foot">
          <button class="lib-btn" id="btnLibrary" aria-label="Library folder"></button>
        </footer>
      </aside>
      <section class="pane list" id="listPane">
        <div class="list-title" id="listTitle"></div>
        <div class="sheets" id="sheets" tabindex="0" aria-label="Sheets"></div>
      </section>
      <main class="editor-pane">
        <div class="trash-bar" id="trashBar">
          <span id="trashBarText">This sheet is in the Trash.</span>
          <span class="grow"></span>
          <button class="btn primary" id="btnTrashRestore">Restore</button>
          <button class="btn danger" id="btnTrashPurge">Delete permanently</button>
        </div>
        <div class="editor" id="editor"></div>
        <div class="empty" id="empty">
          <p>Pick a sheet, or start a new one.</p>
          <button class="btn" id="btnEmptyNew">New sheet</button>
        </div>
        <footer class="status" id="status">
          <span id="stWords">0 words</span>
          <span id="stChars">0 characters</span>
          <span id="stRead">0 min read</span>
          <span class="grow"></span>
          <span id="stSave"></span>
        </footer>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
